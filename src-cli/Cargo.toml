[package]
name = "harnex-cli"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Native Harnex launcher and exact Runtime Domain client"

[[bin]]
name = "harnex"
path = "src/main.rs"

[dependencies]
harnex-host-runtime = { path = "../host-runtime" }
chrono = "0.4"
ctrlc = { version = "3.4", features = ["termination"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
textwrap = "0.16"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_System_Console", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory"] }
winreg = "0.55"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
