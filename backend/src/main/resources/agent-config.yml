    # Conservative baseline for a new/unknown OpenAI-compatible Chat endpoint. It assumes the endpoint supports
    # streaming and function tools (required by the Agent loop), but sends no usage extension, sampling control,
    # reasoning replay, provider cache field, or native attachment. Ark can use this baseline; its Context caching is
    # a separate API workflow and is intentionally not claimed/implemented by the generic Chat adapter.
    openai-compatible-chat-safe:
      label: openai-compatible
      type: openai-compatible
      instruction-role: system
      max-tokens-field: max_tokens
      streaming: true
      stream-usage: false
      function-tools: true
      sampling-policy: omit
      reasoning-replay: never
      prompt-cache-mode: none

  # User-owned endpoint/key/model data. The highest-precedence YAML document that declares this key owns the entire
  # concrete Provider Map; lower documents never contribute entries or fields. Profiles below/above remain layered.
  providers:
    # Common optional fields for every provider:
    #   enabled: true          # false keeps the source entry but removes it from runtime routes/catalogues
    #   proxy: off             # per-provider URL or off/direct/none; omitted = inherit global/env proxy
    #   max-tokens: 16384      # positive=explicit limit; omitted/0/negative=automatic (no universal cap)
    #   client-emulation/client-version and features are shown below; ordinary endpoints leave them unset/auto.
    primary:
      label: OpenAI Chat
      profile: openai-chat
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      default-model: ${OPENAI_DEFAULT_MODEL:gpt-4o-mini}
      # Optional: curated catalog surfaced to the WebUI model picker. `id` is sent verbatim to
      # the upstream; `tier` is a coarse capability bucket (high/medium/low) used purely for a
      # colour badge; `costHint` is reserved for a future cost-display feature and currently
      # ignored by the UI. Configuration is read at backend startup; restart the process after
      # adding/removing entries (no Provider hot reload or persistent GUI/TUI editor in this release).
      models:
        - { id: gpt-5.6, context-window: 1050000,       label: "GPT-5.6 (Sol)", tier: high,   input-modalities: [text, image, file] }
        - { id: gpt-5.6-sol, context-window: 1050000,   label: "GPT-5.6 Sol",   tier: high,   input-modalities: [text, image, file] }
        - { id: gpt-5.6-terra, context-window: 1050000, label: "GPT-5.6 Terra", tier: medium, input-modalities: [text, image, file] }
        - { id: gpt-5.6-luna, context-window: 1050000,  label: "GPT-5.6 Luna",  tier: low,    input-modalities: [text, image, file] }
        - { id: gpt-5.5, context-window: 1050000,       label: "GPT-5.5",       tier: high,   input-modalities: [text, image, file] }
        - { id: gpt-4o, context-window: 128000,        label: "GPT-4o",        tier: high,   costHint: "1\u00d7",    input-modalities: [text, image] }
        - { id: gpt-4o-mini, context-window: 128000,   label: "GPT-4o mini",   tier: low,    costHint: "0.05\u00d7", input-modalities: [text, image] }
        - { id: o3-mini, context-window: 200000,       label: "o3-mini",       tier: high,   costHint: "3\u00d7", description: "reasoning-tuned", input-modalities: [text] }
    fallback:
      # Opt-in disaster recovery. Enabling this reserved provider is also the automatic-fallback switch.
      enabled: false
      label: DeepSeek
      profile: deepseek-v4
      base-url: ${FALLBACK_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${FALLBACK_API_KEY:}
      default-model: ${FALLBACK_DEFAULT_MODEL:deepseek-v4-flash}
      models:
        - { id: deepseek-flash, context-window: 1000000, label: "DeepSeek V4.1 Flash", tier: medium, input-modalities: [text, image] }
        - { id: deepseek-v4-flash, context-window: 1000000, label: "DeepSeek Flash (legacy alias)", tier: medium, input-modalities: [text, image] }
        - { id: deepseek-v4-pro, context-window: 1000000,   label: "DeepSeek V4 Pro",   tier: high, description: "reasoning-tuned", input-modalities: [text] }
    # Native Anthropic provider (Messages API, /v1/messages). Distinct from the OAI-compatible
    # path: handles tool_use/tool_result content blocks, hoists system prompts, streams via
    # Anthropic's named SSE events, captures extended-thinking signatures for cross-turn replay,
    # and marks a prompt-cache breakpoint on the system prefix. Set ANTHROPIC_API_KEY to enable;
    # every enabled provider is selectable without changing router.default-provider. base-url defaults to
    # https://api.anthropic.com when blank. The anthropic-version header is pinned to the GA value
    # (2023-06-01) and is NOT a knob — modern-model behaviour is controlled by the fields below.
    anthropic:
      enabled: false
      label: Anthropic
      profile: anthropic-messages
      base-url: ${ANTHROPIC_BASE_URL:}
      api-key: ${ANTHROPIC_API_KEY:}
      default-model: ${ANTHROPIC_DEFAULT_MODEL:claude-opus-4-8}
      # Optional user intent; omission is equivalent to auto.
      # features:
      #   reasoning: auto
      #   effort: auto
      #   prompt-cache: auto
      #   web-search: auto     # auto/on: prefer declared native search, otherwise retain local web_search fallback
      #   attachments: auto
      # Strict Claude Code relays only:
      # client-emulation: claude-code
      # client-version: 2.1.187
    # To add official Kimi/xAI/Gemini endpoints, create a normal provider entry like these. Profiles own protocol
    # details; users only supply endpoint/key/model. router.default-provider chooses the "Auto" endpoint.
    # kimi:
    #   profile: moonshot-kimi-chat
    #   api-key: ${MOONSHOT_API_KEY:}
    # grok:
    #   profile: xai-responses-grok45
    #   api-key: ${XAI_API_KEY:}
    # gemini:
    #   profile: gemini-interactions
    #   api-key: ${GEMINI_API_KEY:}
    # Native OpenAI Responses API (/v1/responses) — OpenAI's current surface for reasoning models
    # (GPT-5.x / o-series). Stateless: store=false + encrypted reasoning items replayed across turns.
    # Distinct from the OpenAI Chat Completions path above. Other compatible vendors should select their verified
    # vendor profile or openai-compatible-chat-safe rather than inheriting OpenAI-specific extensions. Set
    # OPENAI_API_KEY to enable. Set
    # OPENAI_RESPONSES_DEFAULT_MODEL to a real Responses-capable model id for your account.
    openai-responses:
      enabled: false
      label: OpenAI Responses
      profile: openai-responses
      base-url: ${OPENAI_RESPONSES_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      default-model: ${OPENAI_RESPONSES_DEFAULT_MODEL:gpt-5.1}
      # Runtime capability contract: Responses sends input_image/input_file only for an exact configured id
      # containing the matching modality. Add relay aliases/custom snapshots explicitly.
      models:
        - { id: gpt-6-astra, context-window: 1050000, label: "GPT-6 Astra", tier: high, input-modalities: [text, image, file] }
        - { id: gpt-6.1-sol, context-window: 1050000 }
        - { id: gpt-6.1-terra, context-window: 1050000 }
        - { id: gpt-6-sol, context-window: 1050000 }
        - { id: gpt-6-luna, context-window: 1050000 }
        - { id: gpt-5.1, context-window: 400000,       label: "GPT-5.1",       tier: high,   input-modalities: [text, image, file] }
        - { id: gpt-5.5, context-window: 1050000,       label: "GPT-5.5",       tier: high,   input-modalities: [text, image, file] }
        - { id: gpt-5.6, context-window: 1050000,       label: "GPT-5.6 (Sol)", tier: high,   input-modalities: [text, image, file] }
        - { id: gpt-5.6-sol, context-window: 1050000,   label: "GPT-5.6 Sol",   tier: high,   input-modalities: [text, image, file] }
        - { id: gpt-5.6-terra, context-window: 1050000, label: "GPT-5.6 Terra", tier: medium, input-modalities: [text, image, file] }
        - { id: gpt-5.6-luna, context-window: 1050000,  label: "GPT-5.6 Luna",  tier: low,    input-modalities: [text, image, file] }
      # thinking: adaptive   # enable reasoning (sends reasoning.summary + encrypted_content for replay)
      # effort: high         # → reasoning.effort; allowed values are validated per model
      # max-tokens: 16384    # → max_output_tokens
      # send-temperature: false  # default false; reasoning models (gpt-5.x/o-series) reject temperature
      # Cache behaviour is selected by the resolved provider→rule→exact capability. Relay aliases need an explicit contract.

  router:
    # Used only when the request/thread does not select a provider. This is not a failover list.
    # Empty means the first enabled non-fallback entry in the owning providers Map. This lets a user-owned Provider
    # collection replace the packaged catalogue without also having to override router settings.
    default-provider: ""
    # NOTE: "parse" is intentionally NOT in this list. A malformed SSE chunk almost
    # never recovers by switching providers — it usually indicates a transient single-frame
    # upstream glitch in an otherwise healthy stream. Failing over wastes the next provider's
    # quota and may produce duplicate visible text. See ProviderRouter.DEFAULT_FAILOVER_CODES.
    #
    # "stream_ttft_timeout" covers an upstream that completes HTTP 200 but never sends any
    # content within the per-stream TTFT budget (90s default; see -Dharnex.provider.streamTtftMs).
    # Without it, total-budget-ms can be silently defeated by a wedged-but-not-dead upstream
    # that hits the provider's own 10-min idle readTimeout instead of failing over.
    failover-on: ["429","500","502","503","504","529","timeout","network","stream_ttft_timeout"]
    # Wall-clock budget for the entire failover sequence (ms). Stops the router sleeping for the
    # next exponential backoff once exceeded; the last upstream error is rethrown. 0 = unlimited.
    total-budget-ms: 120000
    # Chat keeps the explicitly selected provider sticky. Retry transient failures against it up to this many
    # total attempts, then switch only to the reserved provider id `fallback` (never walk every configured provider).
    selected-provider-max-attempts: 5
    # EWMA is diagnostic only. Circuit-breaker admission is independent and targets provider/model identities.
    ewma-enabled: true
    circuit-breaker-enabled: true
    circuit-failure-threshold: 5
    # After the consecutive-failure threshold opens the circuit, route to `fallback` for this long. Then one request
    # probes the selected provider (HALF_OPEN); success closes the circuit, failure starts another cooldown.
    circuit-open-ms: 30000

  toolsets:
    # Three user-facing modes — match the user mental model (看 / 巡检 / 改) so an IM user
    # picking `/toolset` doesn't have to guess between two synonyms. Aligned with
    #   - read    : 只看      — file_read / glob / grep / web_fetch + 只读元工具
    #   - inspect : 巡检 / 排查 — read + bash（适合 SRE k8s describe / kubectl logs / curl）
    #   - act     : 全做       — inspect + 写文件 / 编辑 / 子代理 / 记忆写入
    # 需要更细粒度时直接在 `presets:` 下追加自定义 key 即可（覆盖关系：presets 非空 → 完全替换内置 3 档）。
    # `mixture_of_agents` 仍然不进任何 preset，按 MoaTool javadoc 解释手工启用。
    default-set: [act]
    presets:
      read:    [file_read, glob, grep, web_fetch, web_search,
                memory_list, skill_list, skill_read, session_search, session_read, session_fact, self_inspect, todo_read, todo_write,
                lesson_record, ask_user]
      inspect: [file_read, glob, grep, web_fetch, web_search, bash,
                memory_list, skill_list, skill_read, session_search, session_read, session_fact, self_inspect, todo_read, todo_write,
                lesson_record, ask_user]
      act:     [bash, file_read, file_write, file_edit, multi_edit, glob, grep, web_fetch, web_search,
                memory_remember, memory_list, memory_forget,
                skill_list, skill_read, session_search, session_read, session_fact, delegate, self_inspect, todo_read, todo_write,
                submit_plan, update_goal, verify, lesson_record, ask_user, image_generate, image_inspect, image_export]
      mcp:     [bash, file_read, file_write, file_edit, multi_edit, glob, grep, web_fetch, web_search,
                memory_remember, memory_list, memory_forget,
                skill_list, skill_read, session_search, session_read, session_fact, delegate, self_inspect, todo_read, todo_write,
                submit_plan, update_goal, verify, lesson_record, ask_user, image_generate, image_inspect, image_export]

  budget:
    per-tool-chars: 8000              # UI 预览：单工具结果超过即在界面截断为 preview + ref:{sha}（可展开）
    per-turn-chars: 30000             # UI 预览：单轮所有工具结果聚合上限
    preview-chars: 1200               # 截断后保留的预览片段长度
    # ── 发给模型(LLM)的独立阈值：与上面的 UI 预览阈值解耦 ──────────────────────────
    # UI 阈值只约束界面显示；模型收到的是完整内容，仅当超过下列(明显更大的)阈值才对模型截断。
    # per-tool-chars-for-llm: 模型侧单工具结果字符上限，默认 100000(约为 UI 8000 的 12 倍)，
    #   日常读文件/grep/bash 输出可完整回传；0 = 不对单工具额外截断(仅受 per-turn-for-llm 与摘要器约束)。
    per-tool-chars-for-llm: 100000
    # per-turn-chars-for-llm: 模型侧单轮聚合字符上限，默认 0 = 关闭(仅 per-tool-for-llm 与摘要器生效)。
    per-turn-chars-for-llm: 0
    # per-tool-tokens-for-llm / per-turn-tokens-for-llm: 模型侧真实 token 上限，默认 0 = 关闭(仅按字符)。
    per-tool-tokens-for-llm: 0
    per-turn-tokens-for-llm: 0

  cron:
    # Cron jobs run unattended with full toolset access. Leaving allowed-toolsets empty means a
    # job may use ANY toolset, which makes the scheduler an effective scheduled-RCE primitive if
    # the prompt is attacker-controlled. In production restrict to the minimum needed, e.g.
    # allowed-toolsets: [read]   — only the inspection-grade preset (file_read / glob / grep /
    # web_fetch / read-only metas). The scheduler validates the EFFECTIVE toolsets (job.toolsets
    # if non-empty, else harnex.toolsets.default-set), so you cannot bypass this allow-list by
    # omitting the toolsets field on the job. max-jobs caps total registered jobs (set 0 for unlimited).
    allowed-toolsets: []
    max-jobs: 100

  approval:
    mode: default        # bypass | default | strict
    # EXTRA dangerous-command regex patterns. As of round-16 these are APPENDED to the
    # hardened built-in defaults (see ApprovalService ctor: broadened rm -rf coverage that
    # catches /home, chmod -R 777 of root-ish paths, fork bomb tolerant of whitespace,
    # curl|sh, dd of=/dev/sdX, mkfs., chmod 777 /, etc). They no longer REPLACE them.
    # Leave empty to use only the baseline; uncomment + add site-specific rules below.
    dangerous-patterns: []
    # Escape hatch: set true to disable additive merging and use ONLY the patterns above
    # (legacy pre-round-16 behaviour). The startup log will WARN. Use this only when you
    # need to deliberately RELAX a baseline pattern and have audited the alternatives.
    replace-default-patterns: false

  execution:
    environment: ${HARNEX_EXECUTION_ENVIRONMENT:host} # host | docker, on the Runtime machine
    sandbox-mode: ${HARNEX_EXECUTION_SANDBOX_MODE:none} # none | read-only | workspace-write; opt-in
    sandbox-network: ${HARNEX_EXECUTION_SANDBOX_NETWORK:deny} # only applies to sandbox/container commands
    sandbox-runtime: ${HARNEX_EXECUTION_SANDBOX_RUNTIME:} # optional @anthropic-ai/sandbox-runtime package directory
    writable-roots: [] # explicit additional cache/output directories on this Runtime host
    image: ${HARNEX_EXECUTION_IMAGE:debian:stable-slim}
    memory: ${HARNEX_EXECUTION_MEMORY:512m}
    cpus: ${HARNEX_EXECUTION_CPUS:1}
    pids-limit: ${HARNEX_EXECUTION_PIDS:256}
  # Hard-validation gates the `verify` tool can execute. The agent is taught to
  # call `verify` before claiming a task is done. Examples (uncomment as needed):
  verify:
    timeout-ms: 180000
    checks: {}
    #  compile:    "mvn -q -DskipTests test-compile"
    #  unit-test:  "mvn -q test"
    #  fe-build:   "cd frontend && npm run build"
    #  typecheck:  "cd frontend && npx vue-tsc --noEmit"

  # Edit-time guard rails:
  #   - file_edit / multi_edit accept exact/EOL context matches against current disk contents;
  #     broader whitespace tolerance requires a current tracked read by default
  #   - every edit checks contents again immediately before writing
  #   - require a recent `file_read` OR explicit overwrite=true before `file_write`
  #     replaces an existing file (new-file writes are always allowed)
  #   - block edits to "protected" paths via globs OR a workspace-level `.harnexignore`
  # Combined with snapshot-based undo, this catches the classic
  # "AI rewrote a file from stale memory and clobbered my changes" failure mode BEFORE
  # the damage rather than only repairing it after.
  safety:
    respect-ignore-file: true            # honour <workspace>/.harnexignore
    tracker-max-entries-per-thread: 256
    # Credential / PII scrubbing applied by SensitiveDataMiddleware (in-memory tool
    # results re-entering the LLM context), BudgetEnforcer (oversize tool-result blobs
    # persisted to data/tool_results/<tid>/<sha>.txt), and LlmAuditLog (when
    # harnex.audit.enabled=true). All three layers share SecretRedactor as the single
    # pattern source — keep these two flags in lock-step across deployments.
    #
    # redact-secrets-in-tool-results=true (default) is required for any non-trivial
    # deployment: model-echoed sk-..., ghp_..., AKIA..., AIza..., JWTs and password=...
    # / api_key=... / secret=... assignments are stripped before the redacted text is
    # both shown to the model on the next iteration AND persisted to disk.
    #
    # redact-pii-in-tool-results=false (default) is intentionally OPT-IN: PII patterns
    # (CN mobile, CN national ID, email, credit-card-shaped digit groups) frequently
    # appear in legitimate user-facing requests ("look up the issue alice@example.com
    # filed"). Compliance-grade deployments (HR / legal / healthcare / finance) should
    # set this to true; personal / dev installs leave it off.
    redact-secrets-in-tool-results: ${HARNEX_REDACT_SECRETS:true}
    redact-pii-in-tool-results: ${HARNEX_REDACT_PII:false}
    protected-globs:
      - "**/.env"
      - "**/.env.*"
      - "**/secrets/**"
      - "**/*.pem"
      - "**/*.key"
      - "**/id_rsa"
      - "**/id_ed25519"
      - "**/.git/**"

  moa:
    enabled: false
    reference-models: []
    aggregator-model:

  auth:
    # Local user-level product: no interactive account/login by default.
    # Remote/shared API deployments must opt in explicitly with HARNEX_AUTH_ENABLED=true.
    enabled: ${HARNEX_AUTH_ENABLED:false}
    # Comma-separated via env HARNEX_AUTH_TOKENS, or list here.
    tokens: ${HARNEX_AUTH_TOKENS:}
    public-paths:
      # Local API capability discovery + the whole auth resource (docs/03 §3.14): clients probe
      # the runtime and exchange credentials (boot-token or interactive login) BEFORE they hold
      # a session. No user data exposed; each endpoint proves identity its own way.
      - /api/v1/protocol
      - /api/v1/scope
      - /api/v1/auth
      - /actuator/health
      - /actuator/info
      # IM gateway endpoints (DingTalk / Feishu / WeCom / generic webhook) authenticate
      # the *caller* via per-platform HMAC/nonce signatures inside their own controllers
      # (see DingTalkGateway / FeishuGateway / WeComGateway / WebhookController). Putting
      # them behind the cookie-based bearer auth filter would 401 every legitimate
      # platform-direct webhook because the IM platforms have no way to attach our
      # HARNEX_TOKEN. CSRF is similarly exempted in CsrfConfig#PUBLIC_PREFIXES.
      - /api/gateway
      # /actuator/prometheus is NOT public by default — it leaks JVM internals.
      # If you want local-only Prometheus scraping, prefer binding management to 127.0.0.1
      # in application.yml (`management.server.address: 127.0.0.1`) over re-exposing it here.

  subagent:
    max-per-thread: 3
    # Bounded default; set 0 explicitly to inherit harnex.max-iterations. A delegate override may only lower it.
    # One iteration is an LLM round trip, not one file chunk; prefer search/range/parallel reads for large documents.
    max-iterations: ${HARNEX_SUBAGENT_MAX_ITERATIONS:64}
    soft-timeout-ms: ${HARNEX_SUBAGENT_SOFT_TIMEOUT_MS:1200000} # 20 min: progress checkpoint, then resume
    timeout-ms: ${HARNEX_SUBAGENT_TIMEOUT_MS:0} # No local execution deadline by default; explicit parent/Goal limits still apply
    queue-timeout-ms: ${HARNEX_SUBAGENT_QUEUE_TIMEOUT_MS:120000} # 2 min admission wait, separate from execution

  gateway:
    # Generic /api/gateway/inbound — HMAC-SHA256 of body against X-Harnex-Signature.
    webhook-secret: ${HARNEX_GATEWAY_SECRET:}
    # DingTalk outgoing-bot signature secret (HMAC-SHA256 of "{ts}\n{secret}"). Empty = endpoint disabled.
    dingtalk-secret: ${HARNEX_DINGTALK_SECRET:}
    # WeCom (企业微信) callback token — sha1(token+timestamp+nonce+payload). Empty = endpoint disabled.
    wecom-token: ${HARNEX_WECOM_TOKEN:}
    # Feishu/Lark event signature — the **Encrypt Key** from the Feishu/Lark developer
    # console (NOT the verification token; that's `feishu-verification-token` below). The
    # signature is a **plain SHA-256** digest of `timestamp + nonce + encrypt_key + raw_body`
    # (NOT HMAC) per
    # https://open.feishu.cn/document/server-docs/event-subscription-guide/event-subscription/data-decrypt-and-verification
    # **Empty = fail-closed**: real `event_callback` POSTs are rejected with HTTP 503; the
    # initial `url_verification` handshake (Phase 1) still works without a configured secret
    # so a freshly registered URL can complete console-side verification before the operator
    # sets the secret. See FeishuGateway.java.
    feishu-secret: ${HARNEX_FEISHU_SECRET:}
    # Optional Feishu verification token cross-check during url_verification handshake.
    feishu-verification-token: ${HARNEX_FEISHU_VTOKEN:}
    # Truncate echoed reply per channel call (full reply still persisted in thread.json).
    reply-max-chars: 3500
    # ----- Outbound push-back (REQUIRED for each IM channel you enable) -----
    # Architecture: the inbound webhook returns 200 immediately; the final agent reply is
    # pushed BACK to the IM group out-of-band via these custom group-robot URLs. This is the
    # pattern used by every mainstream IM bot (Slack apps, ChatGPT-on-WeChat, FastGPT,
    # LangChain adapters) — it removes any dependency on the platform's flaky "automatic
    # redelivery on no-ack" behaviour.
    #
    # If you enable a channel's inbound secret above WITHOUT setting its outbound URL here,
    # the inbound endpoint will refuse messages with HTTP 503 (so misconfigurations surface
    # immediately instead of silently dropping every agent answer).
    #
    # DingTalk: create a "custom group robot" in your group, copy its webhook URL (already
    #   contains ?access_token=...). If you turn on the "签名" security option, also paste
    #   the SECxxx string into sign-secret.
    dingtalk-outbound:
      webhook-url: ${HARNEX_DINGTALK_OUTBOUND_URL:}
      sign-secret: ${HARNEX_DINGTALK_OUTBOUND_SIGN:}
    # Feishu: create a "自定义机器人" in your group, copy its hook URL (.../bot/v2/hook/XXX).
    #   If "签名校验" is on, paste the secret here.
    feishu-outbound:
      webhook-url: ${HARNEX_FEISHU_OUTBOUND_URL:}
      sign-secret: ${HARNEX_FEISHU_OUTBOUND_SIGN:}
    # WeCom: create a group robot, copy its webhook URL (already contains ?key=...).
    #   No separate secret — rotation = create a new robot in the group.
    wecom-outbound:
      webhook-url: ${HARNEX_WECOM_OUTBOUND_URL:}
    # ----- Sender allowlist -----
    # Gate for inbound IM / webhook senders (DingTalk / Feishu / WeCom / generic
    # webhook / Alertmanager). Two formats are accepted per entry:
    #   - "user-id"           -> matches that user on ANY channel
    #   - "channel:user-id"   -> matches only when the inbound channel matches too
    #   - "*"                 -> wildcard, allow EVERY sender on every channel
    #
    # Default ships as ["*"] (allow-all) so a fresh install talks back on the first
    # IM message without extra config. The runtime is fail-closed: an EMPTY list
    # ([]) denies everything and logs a WARN per (channel,user). For production
    # deployments tighten this down to the operators / bots that should drive the
    # agent — the platform secret only proves the request came from the IM bridge,
    # not that the human is authorised.
    #
    # **Production posture**: override via `HARNEX_GATEWAY_ALLOWED_SENDERS` (or a
    # prod profile YAML) with the explicit list of operator / bot ids — e.g.
    #   HARNEX_GATEWAY_ALLOWED_SENDERS=feishu:ou_abc,dingtalk:user-xyz
    # Leaving the wildcard in production effectively means "anyone who can post
    # into the bound IM group can drive the agent".
    # Edits to this list require a process restart to take effect — the existing
    # POST /api/workspace/reload endpoint only re-reads AGENTS.md (see
    # WorkspaceContext.reload()), it does NOT re-bind @ConfigurationProperties.
    allowed-senders: ["*"]
    # Examples:
    # allowed-senders:
    #   - "feishu:ou_abc123"        # only this Feishu open_id
    #   - "ops-bot"                 # this user on any channel
    # Dedicated HMAC-SHA256 secret for /api/gateway/alertmanager. Independent of
    # webhook-secret so you can rotate the alerting credentials without touching IM bridges.
    alertmanager-secret: ${HARNEX_ALERTMANAGER_SECRET:}
    # Per-channel default toolset / model — applied on the FIRST turn of a
    # brand-new thread minted by an IM gateway. Subsequent turns honour whatever the user /
    # model later sets. Empty = no override (use the global harnex.toolsets.default-set).
    # Channel keys: feishu / dingtalk / wecom / webhook / alertmanager / cron / webui / tui.
    channel-defaults: {}
    # Examples:
    # channel-defaults:
    #   feishu:       { toolsets: [read] }
    #   dingtalk:     { toolsets: [inspect] }
    #   alertmanager: { toolsets: [inspect], model: deepseek-chat }

  # History summariser — dedicated continuation-summary model. ON by default.
  # Check the soft watermark before requests (including text-only turns) and after tool batches; keep a hard guard.
  # Count the prepared messages, tools and reminders together; provider usage calibrates remaining protocol overhead.
  # target-percent is aspirational: useful working headroom is success even when the target cannot be reached.
  # When `enabled: false` the same triggers fire but with deterministic truncation
  # (no LLM call). Use a reliable model: the result becomes the state for later turns.
  summarizer:
    enabled: ${HARNEX_SUMMARIZER_ENABLED:true}
    # Empty = the task's actual provider/model. A configured target is tried first; the reserved fallback and task
    # target are then attempted when distinct. Target health is isolated from normal Chat routing.
    provider: ${HARNEX_SUMMARIZER_PROVIDER:}
    model: ${HARNEX_SUMMARIZER_MODEL:}                  # empty => provider default
    context-window: 128000
    output-reserve-tokens: 16000
    safety-reserve-tokens: 0
    soft-threshold-percent: 75
    hard-threshold-percent: 90
    target-percent: 40
    min-new-tokens: 16000
    min-new-context-percent: 15
    minimum-reduction-percent: 20
    max-ineffective-compressions: 3
    keep-tail: 0                                  # 0 = token budget only; optional message-count cap
    keep-tail-chars: 0                            # 0 = token budget only; optional character cap
    summary-max-chars: 24000
    # Upper ceiling for adaptive summary generation. The actual request also fits the summary model's remaining
    # window and declared models[].max-output-tokens; prose, fact candidates and counted reasoning share it.
    max-output-tokens: ${HARNEX_SUMMARIZER_MAX_OUTPUT_TOKENS:16384}
    # Independent Runs may compact concurrently; calls above this small bound fail fast to deterministic mode.
    max-concurrent: ${HARNEX_SUMMARIZER_MAX_CONCURRENT:2}
    # Total budget shared by this compression's model attempts and format repair. Exhaustion uses local history
    # handling and never stops the task. An explicitly bounded task can shorten this auxiliary budget.
    timeout-ms: ${HARNEX_SUMMARIZER_TIMEOUT_MS:180000}
    attempt-timeout-ms: ${HARNEX_SUMMARIZER_ATTEMPT_TIMEOUT_MS:90000}
    prefix-reuse: ${HARNEX_SUMMARIZER_PREFIX_REUSE:false}

  # MCP (Model Context Protocol) client — connect to external MCP servers
  # to discover and use their tools alongside built-in tools.
  # Supported transports: stdio, sse, streamable-http (alias: http).
  # Examples below are commented out so no external MCP servers start by default.
  mcp:
    servers: []
    # Expose Harnex's own tools as an MCP server so external agents
    # (Claude Desktop / Cursor / Continue / another Harnex) can call them via JSON-RPC
    # at POST /api/mcp/server/rpc. Disabled by default — turning it on lets any holder of a
    # valid bearer token drive bash/file_write/etc. on this host. Operators MUST opt in.
    # `server-toolset` controls which preset (read / inspect / act / your-custom) is exposed;
    # default `read` is the safest non-empty option.
    server-enabled: ${HARNEX_MCP_SERVER_ENABLED:false}
    server-toolset: ${HARNEX_MCP_SERVER_TOOLSET:read}
    # Permission mode applied to every synthetic thread that backs an MCP /api/mcp/server/rpc
    # call. There is no UI emitter on this entrypoint, so an ASK decision from ApprovalService
    # would block on the 120s approval-wait deadline and then deny — turning every gated call
    # into a 2-minute hang. `yolo` short-circuits ASK to ALLOW (the dangerous-pattern denylist
    # under harnex.approval.dangerous-patterns and the exposed-toolset cap above remain in
    # force). Set to `accept-edits` to auto-allow only file/memory writes and let bash /
    # web_fetch / delegate fail fast.
    server-permission-mode: ${HARNEX_MCP_SERVER_PERMISSION_MODE:yolo}
    # Example configurations:
    # servers:
    #   # ---- Prometheus (READ ONLY metrics) ----
    #   - name: prometheus
    #     transport: stdio
    #     command: npx
    #     args: ["-y", "@modelcontextprotocol/server-prometheus"]
