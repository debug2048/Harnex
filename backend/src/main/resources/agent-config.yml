    # Alibaba Cloud Model Studio's Qwen Chat endpoint. Version/model differences are data rules rather than
    # selectable profiles. Preserved thinking remains an advanced user intent because optional preservation is billed.
    dashscope-qwen-chat:
      label: qwen
      type: openai-compatible
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      default-model: qwen3.7-plus
      instruction-role: system
      max-tokens-field: max_completion_tokens
      output-reserve-tokens: 65536
      streaming: true
      stream-usage: true
      function-tools: true
      sampling-policy: always
      reasoning-efforts: []
      reasoning-replay: never
      prompt-cache-mode: content_cache_control
      prompt-caching: true
      model-capability-rules:
        # Open-weight 3.8 models accept effort and vision, but are not in the preserve_thinking
        # support list. Do not inherit Max/Flash's preservation or unverified explicit cache fields.
        # https://help.aliyun.com/zh/model-studio/qwen-api-via-openai-chat-completions
        - match: 'qwen3\.8-(?:27b|2\.4t-a95b)'
          capabilities:
            # The documented max_completion_tokens allowlist does not include these open-weight IDs.
            max-tokens-field: max_tokens
            reasoning-efforts: [none, minimal, low, medium, high, xhigh, max]
            prompt-cache-mode: auto_prefix
        # Current 3.8 Max/Flash use effort control and require complete preserved thinking.
        # The official upgrade routes Max Preview requests to Max; use the same contract for that alias.
        # https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
        - match: 'qwen3\.8-(?:max(?:-0902|-preview)?|flash)'
          capabilities:
            output-reserve-tokens: 131072
            reasoning-efforts: [none, minimal, low, medium, high, xhigh, max]
            reasoning-replay: all
            reasoning-history: required
            reasoning-history-field: preserve_thinking
        # Omni uses implicit caching and input_audio data URLs; keep it separate from Max/Flash.
        # https://www.alibabacloud.com/help/en/model-studio/qwen-omni
        - match: 'qwen3\.8-omni-flash'
          capabilities:
            max-tokens-field: max_tokens
            output-reserve-tokens: 131072
            reasoning-efforts: [none, minimal, low, medium, high, xhigh, max]
            reasoning-replay: all
            reasoning-history: required
            reasoning-history-field: preserve_thinking
            prompt-cache-mode: auto_prefix
            audio-input-encoding: data_url
            request-options: { modalities: [text] }
        # Qwen3.7 thinking-only snapshots cannot disable thinking; preservation remains optional.
        - match: 'qwen3\.7-max(?:-preview|-2026-05-17)'
          capabilities:
            reasoning-replay: all
            reasoning-history: optional
            reasoning-history-field: preserve_thinking
            thinking:
              field: enable_thinking
              default-state: always_on
              enabled-value: true
              send-default: false
        # Current Qwen3.7/3.6 hybrid families support explicit preserved thinking.
        - match: 'qwen3\.7-(?:max(?:-us|-2026-(?:05-20|06-08))?|plus(?:-us|-2026-05-26)?|flash(?:-2026-07-15)?)'
          capabilities:
            reasoning-replay: all
            reasoning-history: optional
            reasoning-history-field: preserve_thinking
            thinking:
              field: enable_thinking
              default-state: "on"
              enabled-value: true
              disabled-value: false
              send-default: false
        - match: 'qwen3\.6-(?:max-preview|plus(?:-2026-04-02)?|flash(?:-2026-04-16)?)'
          capabilities:
            reasoning-replay: all
            reasoning-history: optional
            reasoning-history-field: preserve_thinking
            thinking:
              field: enable_thinking
              default-state: "on"
              enabled-value: true
              disabled-value: false
              send-default: false
        # Qwen3.5 remains hybrid but does not inherit preservation support without current official evidence.
        - match: 'qwen3\.5-(?:plus(?:-2026-02-15)?|flash(?:-2026-02-23)?|397b-a17b|122b-a10b|27b|35b-a3b)'
          capabilities:
            thinking:
              field: enable_thinking
              default-state: "on"
              enabled-value: true
              disabled-value: false
              send-default: false
      models:
        - { id: qwen3.8-max, context-window: 1000000, label: "Qwen3.8 Max", tier: high, input-modalities: [text, image, video] }
        - { id: qwen3.8-max-0902, context-window: 1000000, label: "Qwen3.8 Max (0902)", tier: high, input-modalities: [text, image, video] }
        - { id: qwen3.8-flash, context-window: 1000000, label: "Qwen3.8 Flash", tier: medium, input-modalities: [text, image, video] }
        - { id: qwen3.8-omni-flash, context-window: 1000000, label: "Qwen3.8 Omni Flash", tier: medium, input-modalities: [text, image, audio, video] }
        - { id: qwen3.8-27b, context-window: 1000000, label: "Qwen3.8 27B", tier: low, input-modalities: [text, image, video] }
        - { id: qwen3.8-2.4t-a95b, context-window: 1000000, label: "Qwen3.8 2.4T A95B", tier: high, input-modalities: [text, image, video] }
        # https://www.alibabacloud.com/en/notice/alibaba_cloud_model_studio_model_upgrade_notice_81a?_p_lc=1
        - { id: qwen3.8-max-preview, context-window: 1000000, label: "Qwen3.8 Max Preview", tier: high, description: "Official alias routes to Qwen3.8 Max", input-modalities: [text, image, video] }
        - { id: qwen3.7-max, context-window: 1000000, label: "Qwen3.7 Max", tier: high, input-modalities: [text] }
        - { id: qwen3.7-plus, context-window: 1000000, label: "Qwen3.7 Plus", tier: high, input-modalities: [text] }
        - { id: qwen3.7-flash, context-window: 1000000, label: "Qwen3.7 Flash", tier: medium, input-modalities: [text] }
        - { id: qwen3.6-max-preview, context-window: 262144, label: "Qwen3.6 Max Preview", tier: high, input-modalities: [text] }
        - { id: qwen3.6-plus, context-window: 1000000, label: "Qwen3.6 Plus", tier: medium, input-modalities: [text] }
        - { id: qwen3.6-flash, context-window: 1000000, label: "Qwen3.6 Flash", tier: low, input-modalities: [text] }
        - { id: qwen3.5-plus, context-window: 1000000, label: "Qwen3.5 Plus", tier: medium, input-modalities: [text] }
        - { id: qwen3.5-flash, context-window: 1000000, label: "Qwen3.5 Flash", tier: low, input-modalities: [text] }

