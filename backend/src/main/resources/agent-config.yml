# Harnex agent configuration. Override ${ENV} with real env vars in production.
harnex:
  # Schema version. Bump in lock-step with the binary's
  # ConfigMigrator.CURRENT_SCHEMA_VERSION whenever a breaking change lands.
  version: 1
  # Project data follows the project disk; relative paths are anchored at the project root.
  # PERSONAL Runtime uses <user-data-dir>/personal independently of this project setting.
  data-dir: .harnex/data
  skills-dir: .harnex/skills
  max-iterations: 200
  # Top-level interactive chat only. Goal/sub-agent loops retain their independent max-iterations budgets.
  ordinary-max-iterations: 64
  finalization-grace-iterations: 2
  # Lifetime of one SSE subscription, not of the Run. Clients resume with afterSeq after timeout.
  sse-timeout-ms: 3600000
  tool-parallelism: 8

  # Egress proxy (VSCode-style single URL). Leave commented for direct connections.
  # Per-provider `proxy:` below takes precedence; built-in bypass already covers
  # loopback / RFC1918 / *.local / *.internal / *.corp. See docs/04 §11a for details.
  # http:
  #   proxy: ${HARNEX_HTTP_PROXY:}            # http://user:pass@host:port | socks5://... | off
  #   proxy-support: fallback                # on | off | fallback (probe baseUrl first, 3s)
  #   proxy-bypass:
  #     - "*.internal"

  # Native attachments — when enabled, declared image/file/PDF uploads use each API's own typed
  # content blocks. Known official models require BOTH vendor support and this endpoint model's exact
  # input-modalities declaration. For unknown/custom relay ids, that exact declaration is the operator's explicit
  # capability override; otherwise attachments degrade to a visible file_read/OCR hint.
  # Set enabled:false to force local Tika sidecars + file_read for every attachment.
  vision:
    enabled: ${HARNEX_VISION_ENABLED:true}
    max-attachment-bytes: 10485760     # 10 MB hard cap per inline attachment
    detail: auto                  # auto | low | high | original (OpenAI vision detail hint)
    max-attachments-per-message: 8
    # Server-side OCR fallback for non-vision models: when true, file_read can OCR an
    # uploaded image on demand via Tika+Tesseract and cache the recognised text in a
    # sidecar `<name>.extracted.txt`. Native-capable models receive the original image
    # without paying this OCR cost. Requires `tesseract` on PATH; if it is missing the
    # upload still succeeds and the original remains available to native vision models.
    ocr-fallback: ${HARNEX_OCR_FALLBACK:true}
    ocr-language: ${HARNEX_OCR_LANG:eng+chi_sim}
    ocr-timeout-ms: 60000
    ocr-command: 'tesseract "{file}" - -l eng+chi_sim'

  # Optional third-party web_search tool. Advertised only when enabled and the selected backend is configured.
  # Configure/test it in Settings → Web search, or set the environment variables below.
  # Repeated terminal errors open the runtime circuit breaker; health is visible via self_inspect / doctor.
  web-search:
    enabled: ${HARNEX_WEBSEARCH_ENABLED:false}
    # Backend: tavily | exa | brave | searxng | perplexity | anysearch | tinyfish. Only the named backend is invoked.
    #   All hosted backends require api-key. searxng → KEYLESS, set endpoint to your instance.
    provider: ${HARNEX_WEBSEARCH_PROVIDER:tavily}
    api-key: ${HARNEX_WEBSEARCH_KEY:}                # blank => tool not advertised (searxng ignores this)
    endpoint: ${HARNEX_WEBSEARCH_ENDPOINT:}          # blank => backend default; REQUIRED for searxng (e.g. http://localhost:8888)
    max-results: 10
    language: ""                                   # AnySearch/TinyFish: optional language (e.g. zh or en); blank=service default
    timeout-ms: 15000
    circuit-threshold: 3                            # consecutive terminal failures before the breaker opens
    circuit-cooldown-ms: 600000                     # 10 min fast-fail window once open

  # ask_user tool — lets the agent ask the user a clarifying question with optional suggested
  # options. Anti-nag by design: the prompt steers the model to ask only for direction/scope
  # changes, irreversible actions, or missing un-inferable info; max-per-turn caps how many
  # questions a single user turn may raise. Headless/cron runs return a "proceed" sentinel
  # immediately (never block). timeout-ms bounds the interactive wait.
  ask:
    timeout-ms: 1800000      # 30 min wait for an answer before returning the proceed sentinel
    max-per-turn: 2          # anti-nag: excess ask_user calls in one turn short-circuit

  # Autonomous goal (/goal) guard rails. A goal auto-continues across turns until the model
  # verifies it complete / blocked, or an explicitly configured cap trips. All Goal budgets default
  # to 0 (unlimited); token budgets can also be set per-goal via "/goal … +500k".
  goal:
    max-turns: ${HARNEX_GOAL_MAX_TURNS:0}                  # 0 = unlimited; only explicit budgets stop continuation
    default-token-budget: ${HARNEX_GOAL_TOKEN_BUDGET:0}     # 0 = unlimited unless /goal … +budget is given
    wall-clock-budget-ms: ${HARNEX_GOAL_WALLCLOCK_MS:0}     # 0 = unlimited

  # /plan review gate. submit_plan suspends the agent until the user approves/rejects over
  # POST /api/plan-review/...; this bounds that wait so an abandoned review can't pin a worker.
  # Headless callers (no SSE emitter) auto-approve and never wait.
  plan:
    review-timeout-ms: ${HARNEX_PLAN_REVIEW_TIMEOUT_MS:1800000}   # 30 min

  # Snapshot / undo insurance. Conversation snapshots are content-addressed manifests;
  # file rollback captures selective before-blobs for files touched by write tools / git diff.
  # Whole-project archive rollback has been removed; these knobs control the new file-level path.
  snapshot:
    conversation: ${HARNEX_SNAPSHOT_CONVERSATION:true}
    file-rollback: ${HARNEX_SNAPSHOT_FILE_ROLLBACK:true}
    # When true, file_write fails if it cannot capture a rollback blob for an existing target.
    # Default false keeps compatibility with large / excluded / binary-heavy workspaces.
    strict-capture-for-writes: ${HARNEX_SNAPSHOT_STRICT_CAPTURE_FOR_WRITES:false}
    respect-gitignore: ${HARNEX_SNAPSHOT_RESPECT_GITIGNORE:true}
    max-file-bytes: ${HARNEX_SNAPSHOT_MAX_FILE_BYTES:5242880}                 # 5 MB per file blob
    max-files-per-snapshot: ${HARNEX_SNAPSHOT_MAX_FILES_PER_SNAPSHOT:200}
    capture-timeout-ms: ${HARNEX_SNAPSHOT_CAPTURE_TIMEOUT_MS:1500}
    git-timeout-ms: ${HARNEX_SNAPSHOT_GIT_TIMEOUT_MS:2000}
    max-snapshots-per-thread: ${HARNEX_SNAPSHOT_MAX_SNAPSHOTS_PER_THREAD:20}
    total-disk-budget-bytes: ${HARNEX_SNAPSHOT_TOTAL_DISK_BUDGET_BYTES:268435456} # 256 MiB
    protect-globs:
      - ".env"
      - ".env.*"
      - "config/**/*.yml"
      - "config/**/*.yaml"
    exclude-globs:
      - "**/node_modules/**"
      - "**/.git/**"
      - "**/target/**"
      - "**/build/**"
      - "**/dist/**"
      - "**/.gradle/**"
      - "**/.idea/**"
      - "**/.vscode/**"
      - "**/__pycache__/**"
      - "**/.venv/**"
      - "**/venv/**"
      - "**/.next/**"
      - "**/.cache/**"
      - "**/*.log"
      - "**/*.tmp"
      - "**/*.pyc"
      - "**/*.class"

  # User-facing BYOK providers. A higher-precedence user/project YAML that declares `providers` replaces this whole
  # concrete Map; list every endpoint that file should expose. It does not inherit entries, fields, or model lists
  # from this built-in Map. Command-line/environment values may still override fields at their normal precedence.
  # A provider selects exactly one profile.
  # The profile owns adapter/wire behaviour and may provide safe official endpoint/default-model plus an internal
  # capability/suggestion catalogue. This block owns the key, user intent, and the endpoint's selectable models.
  # Omitting `models` exposes only `default-model`; an explicit list exposes only that subset (the default is
  # automatically included). Same-id entries inherit verified metadata/capabilities from the selected profile.
  # Provider/profile ids match [A-Za-z0-9][A-Za-z0-9_-]{0,63}; put human display text in `label`.
  # openai-compatible requires a final base-url; openai-responses/anthropic/gemini may use official defaults.
  #
  # providers:
  #   my-openai:
  #     profile: openai-responses
  #     base-url: https://api.openai.com/v1
  #     api-key: ${OPENAI_API_KEY:}
  #     default-model: <current-model-id>
  #   my-qwen:
  #     profile: dashscope-qwen-chat
  #     api-key: ${DASHSCOPE_API_KEY:}
  #     default-model: <current-model-id>
  #
  # Unknown models remain conservative. Native attachment support requires verified exact metadata from the profile
  # catalogue or an endpoint `models` entry with input-modalities.

  # Maintainer layer. A profile is an adapter/wire template and can include safe official defaults.
  # Resolution composes the protocol/profile baseline, the first profile-local full-match rule, then
  # the exact model overlay. Official snapshot patterns are opt-in per profile. A relay alias can
  # explicitly name a canonical `capability-model`; attachment modalities remain exact-model-only.
  # Keep custom endpoints conservative until their contract is verified. Profile keys use the same
  # stable-id grammar as providers: [A-Za-z0-9][A-Za-z0-9_-]{0,63}.
  provider-profiles:
    # Official OpenAI Chat Completions. The base keeps GPT-4o-compatible sampling; reasoning-model
    # overlays replace the token/role/sampling contract. Tools and effort remain separate declared
    # capabilities. Tools/effort constraints are scoped to verified model IDs, not future releases.
    openai-chat:
      label: openai-chat
      type: openai-compatible
      instruction-role: system
      max-tokens-field: max_tokens
      streaming: true
      stream-usage: true
      function-tools: true
      sampling-policy: always
      reasoning-efforts: []
      reasoning-replay: never
      prompt-cache-mode: key
      prompt-cache-key: true
      prompt-cache-explicit: true
      model-capability-rules:
        # Terra accepts none, but all function tools still require Responses (2026-11-02).
        # https://developers.openai.com/api/docs/models/gpt-6.1-terra
        - match: 'gpt-6\.1-terra'
          capabilities:
            instruction-role: developer
            max-tokens-field: max_completion_tokens
            function-tools: false
            sampling-policy: omit
            reasoning-efforts: [none, low, medium, high, xhigh, max]
            prompt-cache-mode: openai_explicit
        # Verified 2026-10-07: https://developers.openai.com/api/docs/guides/latest-model
        # Astra and 6.1 Sol require Responses for tools and never accept none/minimal effort.
        - match: 'gpt-(?:6-astra|6\.1-sol)'
          capabilities:
            instruction-role: developer
            max-tokens-field: max_completion_tokens
            function-tools: false
            sampling-policy: omit
            reasoning-efforts: [low, medium, high, xhigh, max]
            prompt-cache-mode: openai_explicit
        # GPT-6 Sol/Luna and current GPT-5.6 Sol aliases require none when Chat tools are present.
        - match: 'gpt-(?:6-(?:sol|luna)|5\.6(?:-sol)?)'
          capabilities:
            instruction-role: developer
            max-tokens-field: max_completion_tokens
            sampling-policy: omit
            reasoning-efforts: [none, low, medium, high, xhigh, max]
            function-tool-reasoning-effort: none
            prompt-cache-mode: openai_explicit
        # Future/date snapshots get the family contract but no Sol-only workaround until their endpoint is verified.
        - match: 'gpt-5\.6(?:-(?:sol|terra|luna))?(?:-\d{4}-\d{2}-\d{2})?'
          capabilities:
            instruction-role: developer
            max-tokens-field: max_completion_tokens
            sampling-policy: omit
            reasoning-efforts: [none, low, medium, high, xhigh, max]
            prompt-cache-mode: openai_explicit
        - match: 'gpt-5\.5(?:-\d{4}-\d{2}-\d{2})?'
          capabilities:
            instruction-role: developer
            max-tokens-field: max_completion_tokens
            sampling-policy: omit
            reasoning-efforts: [none, low, medium, high, xhigh]
        - match: 'o3-mini(?:-\d{4}-\d{2}-\d{2})?'
          capabilities:
            instruction-role: developer
            max-tokens-field: max_completion_tokens
            sampling-policy: omit
            reasoning-efforts: [low, medium, high]
      models:
        - { id: gpt-6-astra, context-window: 1050000, label: "GPT-6 Astra (Chat only)", tier: high, description: "Use openai-responses for Agent tools", input-modalities: [text, image] }
        - { id: gpt-6.1-sol, context-window: 1050000, label: "GPT-6.1 Sol (Chat only)", tier: high, description: "Use openai-responses for Agent tools", input-modalities: [text, image] }
        - { id: gpt-6.1-terra, context-window: 1050000, label: "GPT-6.1 Terra (Chat only)", tier: medium, description: "Use openai-responses for Agent tools", input-modalities: [text, image] }
        - { id: gpt-6-sol, context-window: 1050000, label: "GPT-6 Sol", tier: high, description: "Chat tools require effort=none; use openai-responses for reasoning with tools", input-modalities: [text, image] }
        - { id: gpt-6-luna, context-window: 1050000, label: "GPT-6 Luna", tier: low, description: "Chat tools require effort=none; use openai-responses for reasoning with tools", input-modalities: [text, image] }
        - { id: gpt-5.6, context-window: 1050000 }
        - { id: gpt-5.6-sol, context-window: 1050000 }
        - { id: gpt-5.6-terra, context-window: 1050000 }
        - { id: gpt-5.6-luna, context-window: 1050000 }
        - { id: gpt-5.5, context-window: 1050000 }
        - { id: gpt-5.1, context-window: 400000 }
        - { id: gpt-4o, context-window: 128000 }
        - { id: gpt-4o-mini, context-window: 128000 }
        - { id: o3-mini, context-window: 200000 }

    # Official OpenAI Responses API. Reasoning output items are replayed natively (including
    # encrypted reasoning content); GPT-5.6/6/6.1 opt into explicit stable-prefix breakpoints.
    openai-responses:
      label: openai-responses
      type: openai-responses
      max-tokens-field: max_output_tokens
      streaming: true
      function-tools: true
      sampling-policy: omit
      reasoning-efforts: []
      reasoning-replay: native_items
      prompt-cache-mode: key
      prompt-cache-key: true
      prompt-cache-explicit: true
      model-capability-rules:
        - match: 'gpt-6\.1-terra'
          capabilities:
            reasoning-efforts: [none, low, medium, high, xhigh, max]
            prompt-cache-mode: openai_explicit
            native-web-search: true
            native-web-search-type: web_search
        - match: 'gpt-(?:6-astra|6\.1-sol)'
          capabilities:
            reasoning-efforts: [low, medium, high, xhigh, max]
            prompt-cache-mode: openai_explicit
            native-web-search: true
            native-web-search-type: web_search
        # GPT-5.5 Pro is Responses/Batch-only and does not support streaming.
        - match: 'gpt-5\.5-pro(?:-\d{4}-\d{2}-\d{2})?'
          capabilities:
            streaming: false
            reasoning-efforts: [medium, high, xhigh]
            # Official pricing offers no cached-input discount for Pro; do not imply cache savings.
            prompt-cache-mode: none
            native-web-search: true
            native-web-search-type: web_search
        - match: '(?:gpt-6-(?:sol|luna)|gpt-5\.6(?:-(?:sol|terra|luna))?(?:-\d{4}-\d{2}-\d{2})?)'
          capabilities:
            reasoning-efforts: [none, low, medium, high, xhigh, max]
            prompt-cache-mode: openai_explicit
            native-web-search: true
            native-web-search-type: web_search
        - match: 'gpt-5\.5(?:-\d{4}-\d{2}-\d{2})?'
          capabilities:
            reasoning-efforts: [none, low, medium, high, xhigh]
            native-web-search: true
            native-web-search-type: web_search
        - match: 'gpt-5\.1(?:-\d{4}-\d{2}-\d{2})?'
          capabilities:
            reasoning-efforts: [none, low, medium, high]
            native-web-search: true
            native-web-search-type: web_search
      models:
        - { id: gpt-6-astra, context-window: 1050000, label: "GPT-6 Astra", tier: high, input-modalities: [text, image, file] }
        - { id: gpt-6.1-sol, context-window: 1050000, label: "GPT-6.1 Sol", tier: high, input-modalities: [text, image, file] }
        - { id: gpt-6.1-terra, context-window: 1050000, label: "GPT-6.1 Terra", tier: medium, input-modalities: [text, image, file] }
        - { id: gpt-6-sol, context-window: 1050000, label: "GPT-6 Sol", tier: high, input-modalities: [text, image, file] }
        - { id: gpt-6-luna, context-window: 1050000, label: "GPT-6 Luna", tier: low, input-modalities: [text, image, file] }
        - { id: gpt-5.6, context-window: 1050000 }
        - { id: gpt-5.6-sol, context-window: 1050000 }
        - { id: gpt-5.6-terra, context-window: 1050000 }
        - { id: gpt-5.6-luna, context-window: 1050000 }
        - { id: gpt-5.5, context-window: 1050000 }
        - { id: gpt-5.1, context-window: 400000 }
        - { id: gpt-4o, context-window: 128000 }
        - { id: gpt-4o-mini, context-window: 128000 }
        - { id: o3-mini, context-window: 200000 }

    # Native Anthropic Messages API. Official endpoint defaults and the internal capability/suggestion catalogue live
    # in this vendor-specific template; ordered rules own model-family wire differences while exact models only declare
    # presentation metadata and verified attachment modalities.
    anthropic-messages:
      label: anthropic-messages
      type: anthropic
      base-url: https://api.anthropic.com
      default-model: claude-opus-4-8
      max-tokens-field: max_tokens
      streaming: true
      function-tools: true
      sampling-policy: when_thinking_off
      reasoning-efforts: []
      reasoning-replay: native_items
      prompt-cache-mode: content_cache_control
      strict-terminal: false
      model-capability-rules:
        # https://platform.claude.com/docs/en/models/opus-5-5/migration-guide
        - match: 'claude-(?:(?:fable|mythos)-5-1|opus-5-5)'
          capabilities:
            default-max-tokens: 64000
            strict-terminal: true
            sampling-policy: omit
            reasoning-efforts: [low, medium, high, xhigh, max]
            native-web-search: true
            native-web-search-type: web_search_20260318
            thinking:
              field: thinking
              default-state: always_on
              enabled-object: { type: adaptive }
              send-default: false
        # Haiku 5.5 shares this thinking/effort contract, not Haiku 4.5's legacy behavior.
        # https://platform.claude.com/docs/en/models/haiku-5-5/migration-guide
        - match: 'claude-(?:opus-5|haiku-5-5)'
          capabilities:
            default-max-tokens: 64000
            strict-terminal: true
            sampling-policy: omit
            reasoning-efforts: [low, medium, high, xhigh, max]
            thinking-required-efforts: [xhigh, max]
            native-web-search: true
            native-web-search-type: web_search_20260318
            thinking:
              field: thinking
              default-state: "on"
              enabled-object: { type: adaptive }
              disabled-object: { type: disabled }
              send-default: false
        - match: 'claude-(?:fable|mythos)-5'
          capabilities:
            default-max-tokens: 64000
            strict-terminal: true
            sampling-policy: omit
            reasoning-efforts: [low, medium, high, xhigh, max]
            native-web-search: true
            native-web-search-type: web_search_20260318
            thinking:
              field: thinking
              default-state: always_on
              enabled-object: { type: adaptive }
              send-default: false
        - match: 'claude-opus-4-(?:8|7)'
          capabilities:
            default-max-tokens: 64000
            strict-terminal: true
            sampling-policy: omit
            reasoning-efforts: [low, medium, high, xhigh, max]
            native-web-search: true
            native-web-search-type: web_search_20260318
            thinking:
              field: thinking
              default-state: "off"
              enabled-object: { type: adaptive }
              disabled-object: { type: disabled }
              send-default: false
        # 5.5 disables up-front thinking with between_tools; high efforts require adaptive thinking.
        # https://platform.claude.com/docs/en/models/sonnet-5-5/whats-new-sonnet-5-5
        - match: 'claude-sonnet-5-5'
          capabilities:
            default-max-tokens: 64000
            strict-terminal: true
            sampling-policy: omit
            reasoning-efforts: [low, medium, high, xhigh, max]
            thinking-required-efforts: [xhigh, max]
            native-web-search: true
            native-web-search-type: web_search_20260318
            thinking:
              field: thinking
              default-state: "on"
              enabled-object: { type: adaptive }
              disabled-object: { type: between_tools }
              send-default: false
        - match: 'claude-sonnet-5'
          capabilities:
            default-max-tokens: 64000
            strict-terminal: true
            sampling-policy: omit
            reasoning-efforts: [low, medium, high, xhigh, max]
            native-web-search: true
            native-web-search-type: web_search_20260318
            thinking:
              field: thinking
              default-state: "on"
              enabled-object: { type: adaptive }
              disabled-object: { type: disabled }
              send-default: false
        - match: 'claude-(?:sonnet|opus)-4-6'
          capabilities:
            default-max-tokens: 64000
            strict-terminal: true
            sampling-policy: when_thinking_off
            reasoning-efforts: [low, medium, high, max]
            native-web-search: true
            native-web-search-type: web_search_20260318
            thinking:
              field: thinking
              default-state: "off"
              enabled-object: { type: adaptive }
              disabled-object: { type: disabled }
              send-default: false
        - match: 'claude-haiku-4-5(?:-20251001)?'
          capabilities:
            default-max-tokens: 64000
            strict-terminal: true
            sampling-policy: always
            reasoning-efforts: []
      models:
        - { id: claude-fable-5-1, context-window: 1000000, label: "Claude Fable 5.1", tier: high, input-modalities: [text, image, pdf] }
        - { id: claude-mythos-5-1, context-window: 1000000, label: "Claude Mythos 5.1", tier: high, description: "Restricted availability", input-modalities: [text, image, pdf] }
        - { id: claude-opus-5-5, context-window: 1000000, label: "Claude Opus 5.5", tier: high, input-modalities: [text, image, pdf] }
        - { id: claude-sonnet-5-5, context-window: 1000000, label: "Claude Sonnet 5.5", tier: medium, input-modalities: [text, image, pdf] }
        - { id: claude-haiku-5-5, context-window: 1000000, label: "Claude Haiku 5.5", tier: low, input-modalities: [text, image, pdf] }
        - { id: claude-opus-5, context-window: 1000000, label: "Claude Opus 5", tier: high, input-modalities: [text, image, pdf] }
        - { id: claude-fable-5, context-window: 1000000, label: "Claude Fable 5", tier: high, description: "maximum-capability Claude", input-modalities: [text, image, pdf] }
        - { id: claude-mythos-5, context-window: 1000000, label: "Claude Mythos 5", tier: high, input-modalities: [text, image, pdf] }
        - { id: claude-opus-4-8, context-window: 1000000, label: "Claude Opus 4.8", tier: high, input-modalities: [text, image, pdf] }
        - { id: claude-opus-4-7, context-window: 1000000, label: "Claude Opus 4.7", tier: high, input-modalities: [text, image, pdf] }
        - { id: claude-sonnet-5, context-window: 1000000, label: "Claude Sonnet 5", tier: medium, input-modalities: [text, image, pdf] }
        - { id: claude-sonnet-4-6, context-window: 1000000, label: "Claude Sonnet 4.6", tier: medium, input-modalities: [text, image, pdf] }
        - { id: claude-opus-4-6, context-window: 1000000, label: "Claude Opus 4.6", tier: high, input-modalities: [text, image, pdf] }
        - { id: claude-haiku-4-5, context-window: 200000, label: "Claude Haiku 4.5", tier: low, input-modalities: [text, image, pdf] }
        - { id: claude-haiku-4-5-20251001, context-window: 200000, label: "Claude Haiku 4.5 (20251001)", tier: low, input-modalities: [text, image, pdf] }

    # DeepSeek Chat API. Current Flash aliases and V4 Pro require complete thinking replay.
    # Pin legacy snapshot contracts separately; never apply current-alias behavior by a broad V4 prefix.
    deepseek-v4:
      output-reserve-tokens: 65536
      label: deepseek
      type: openai-compatible
      instruction-role: system
      max-tokens-field: max_tokens
      streaming: true
      stream-usage: true
      function-tools: true
      sampling-policy: omit
      reasoning-efforts: [high, max]
      reasoning-replay: tool_calls
      prompt-cache-mode: auto_prefix
      thinking:
        field: thinking
        default-state: "on"
        enabled-object: { type: enabled }
        disabled-object: { type: disabled }
        send-default: false
