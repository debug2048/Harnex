server {
  listen       80;
  server_name  _;
  root /usr/share/nginx/html;
  index index.html;

  # Baseline security headers (applied to every response on every location via `always`).
  # CSP locks script execution to same-origin (the Vite build emits everything as same-origin
  # bundles + a few inline styles); 'unsafe-inline' for style is unavoidable while we ship
  # scoped-style components, but script-src is strict. connect-src includes self only since
  # both /api SSE and the static UI are served behind the same nginx vhost.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  location ~ ^/(api|supervisor)/ {
    proxy_pass http://backend:8088;
    # Preserve the public port, including SSH tunnels and HARNEX_FRONTEND_PORT overrides.
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 15m;
    # Tell upstream nginx / a fronting CDN never to buffer this response. Without these
    # headers, a sidecar Cloudflare / nginx in front of us can sit on tens of seconds of
    # SSE chunks waiting for a fill, making chat feel "hung" even when the backend is
    # streaming continuously.
    add_header X-Accel-Buffering no;
    proxy_set_header X-Accel-Buffering no;
    gzip off;
  }
  location /actuator/ {
    proxy_pass http://backend:8088;
    proxy_set_header Host $http_host;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
