name: Suggestion / 功能建议
description: Describe a user problem or improvement / 描述使用场景与改进建议
title: "[Suggestion] "
body:
  - type: markdown
    attributes:
      value: |
        External feedback is accepted through Issues; PR creation is limited to collaborators.
        当前对外接受 Issue，PR 仅限协作者。请先搜索已有建议，不要包含凭据或机密项目内容。
  - type: textarea
    id: problem
    attributes:
      label: User problem / 希望解决的问题
      description: "Describe a concrete workflow and what gets in your way / 描述具体场景及遇到的障碍"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome / 希望达到的效果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives tried / 已尝试的替代方式
